<style id="css">*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one phone-width column: photo hero fading into olive, logo + name + tagline, sectioned link cards, WhatsApp bar; owner-only editor slides in from the right */
:root{
  --f-body:"Cairo","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p-bg:#f1f1ee;--p-bg2:#f1f1ee;--p-outer:#e4e4de;--p-fg:#1b1b1b;--p-gold:#55554f;--p-rule:#8a8a80;--c-bg:#ffffff;--c-bg2:#ffffff;--c-fg:#161616;--c-sub:#707070;--c-chev:#5a5424;--c-pin-bg:#f3e6cc;--c-pin:#6b6028;--b-radius:12px;
  --e-bg:#ffffff;--e-fg:#18191c;--e-muted:#6a6c73;--e-line:#e3e3e6;--e-card:#f6f6f7;--e-accent:#2f5cff;--e-accent-fg:#ffffff;--e-danger:#c7372f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --e-bg:#17181b;--e-fg:#eceef2;--e-muted:#9a9ca4;--e-line:#2c2e33;--e-card:#1f2024;--e-accent:#6f8dff;--e-accent-fg:#0d0f14;--e-danger:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{
  --e-bg:#17181b;--e-fg:#eceef2;--e-muted:#9a9ca4;--e-line:#2c2e33;--e-card:#1f2024;--e-accent:#6f8dff;--e-accent-fg:#0d0f14;--e-danger:#ff7a70;color-scheme:dark}
html,body{min-height:100%}
body{background:var(--p-outer);color:var(--p-fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#app{min-height:100vh;background:var(--p-outer)}
.lt{position:relative;box-sizing:border-box;max-width:460px;margin:40px auto 0;min-height:calc(100vh - 40px);border-radius:28px 28px 0 0;overflow:hidden;background:linear-gradient(180deg,var(--p-bg) 0%,var(--p-bg2) 100%);box-shadow:0 10px 40px rgba(0,0,0,.35);padding-inline:24px;padding-block:22px 40px;isolation:isolate}
@media (max-width:520px){.lt{margin:0;min-height:100vh;border-radius:0;box-shadow:none}}
.hero{position:absolute;inset:0 0 auto 0;aspect-ratio:941/560;z-index:-1;background-size:100% 100%;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}

.prof{display:flex;flex-direction:column;align-items:center;text-align:center}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none}
.av.blend{border-radius:0;width:82px;height:82px;object-fit:contain}
.av-i{display:grid;place-items:center;background:var(--c-bg);color:var(--c-fg);font-weight:800;font-size:32px}
.prof h1{font-size:33px;line-height:1.25;font-weight:800;margin:14px 0 0;color:var(--p-fg);text-wrap:balance}
.tag{margin:6px 0 0;color:var(--p-gold);font-size:16px;font-weight:500;line-height:1.5;max-width:40ch}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.badge{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--p-gold);background:radial-gradient(circle at 40% 30%,rgba(255,236,190,.20),rgba(255,236,190,.04) 70%),var(--p-bg);border:1px solid color-mix(in srgb,var(--p-gold) 55%,transparent);box-shadow:inset 0 0 8px rgba(0,0,0,.35)}
.badge svg{width:19px;height:19px;fill:currentColor;stroke:none}
.sec-h h2{margin:0;font-size:18px;font-weight:700;color:var(--p-fg);white-space:nowrap}
.rule{flex:1;height:1px;background:linear-gradient(to left,var(--p-rule),color-mix(in srgb,var(--p-rule) 30%,transparent))}
[dir="ltr"] .rule{background:linear-gradient(to right,var(--p-rule),color-mix(in srgb,var(--p-rule) 30%,transparent))}
.links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.lk{display:flex;align-items:center;gap:12px;min-height:60px;box-sizing:border-box;padding:6px 8px 6px 14px;border-radius:var(--b-radius);text-decoration:none;background:linear-gradient(180deg,var(--c-bg),var(--c-bg2));color:var(--c-fg);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 14px rgba(0,0,0,.28);transition:transform .15s ease}
[dir="rtl"] .lk{padding:6px 8px 6px 14px}
.lk:hover{transform:translateY(-1px)}
.lk:focus-visible,.cta:focus-visible,.soc a:focus-visible{outline:3px solid var(--p-gold);outline-offset:3px}
.tile{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;display:block}
.pinc{width:40px;height:40px;margin:0 4px;border-radius:50%;background:var(--c-pin-bg);color:var(--c-pin);display:grid;place-items:center;flex:none}
.pinc svg{width:20px;height:20px;fill:currentColor;stroke:none}
.lk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lk-t b{font-size:17px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.lk-t small{font-size:12.5px;font-weight:500;color:var(--c-sub);line-height:1.4}
.chev{width:22px;height:22px;flex:none;fill:none;stroke:var(--c-chev);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir="ltr"] .chev{transform:scaleX(-1)}
.cta{margin-top:10px;display:flex;align-items:center;gap:12px;min-height:46px;box-sizing:border-box;padding:6px 18px;border-radius:14px;text-decoration:none;color:#fff;background:linear-gradient(to left,#2aa152,#1d773b);border:1px solid rgba(87,226,135,.75);box-shadow:0 0 0 1px rgba(87,226,135,.15),0 6px 18px rgba(22,120,60,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s ease}
[dir="ltr"] .cta{background:linear-gradient(to right,#2aa152,#1d773b)}
.cta:hover{transform:translateY(-1px)}
.cta .wa{width:30px;height:30px;flex:none;fill:none;stroke:#fff;color:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cta span{flex:1;text-align:center;font-size:17px;font-weight:700}
.cta .chev{stroke:#fff}
.soc{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.soc a{width:44px;height:44px;display:grid;place-items:center;color:var(--p-fg);border-radius:50%}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--p-gold);margin-top:32px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#18191c;color:#fff;padding:10px 16px;border-radius:999px;font:600 14px var(--f-body);z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* Owner editor */
.dock{direction:ltr;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px}
.fab2{background:var(--e-bg)!important;color:var(--e-fg)!important}
.pop{direction:ltr;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100% - 32px));box-sizing:border-box;background:var(--e-bg);color:var(--e-fg);border:1px solid var(--e-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:var(--f-body)}
.pop-h{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.opt{display:flex;flex-direction:column;gap:8px;background:var(--e-card);border:1px solid var(--e-line);border-radius:12px;padding:12px}
.opt-t{display:flex;flex-direction:column;gap:2px}.opt-t b{font-size:14px}.opt-t span{font-size:12.5px;color:var(--e-muted)}
.opt code{font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:var(--e-muted);user-select:all}
.opt .btn{justify-content:center}
.fab{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;background:var(--e-accent);color:var(--e-accent-fg);font:700 14px var(--f-body);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab svg.i{width:18px;height:18px}
.ed{direction:ltr;position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--e-bg);color:var(--e-fg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);font-family:var(--f-body);padding-top:env(safe-area-inset-top,0px)}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--e-line)}
.ed-top strong{font-size:16px}
.ed-body{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:22px}
.ed-foot{display:flex;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--e-line)}
.ed-status{flex:1;min-width:0;font-size:13px;color:var(--e-muted)}
.ed-status.warn{color:var(--e-danger)}
.ed h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--e-muted);margin:14px 0 10px}
.ed label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.ed input[type=text],.ed input[type=url],.ed textarea,.ed select{width:100%;box-sizing:border-box;font:500 14px var(--f-body);color:var(--e-fg);background:var(--e-bg);border:1px solid var(--e-line);border-radius:10px;padding:10px 12px}
.ed textarea{resize:vertical;min-height:64px}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--e-accent);outline-offset:0;border-color:transparent}
.ed .stack{display:flex;flex-direction:column;gap:12px}
.btn{font:600 13px var(--f-body);border:1px solid var(--e-line);background:var(--e-bg);color:var(--e-fg);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--e-muted)}
.btn:focus-visible,.fab:focus-visible{outline:2px solid var(--e-accent);outline-offset:2px}
.btn.pri{background:var(--e-accent);color:var(--e-accent-fg);border-color:transparent;padding:10px 18px;font-weight:700}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.big{width:100%;justify-content:center;padding:12px;font-weight:700;background:var(--e-accent);color:var(--e-accent-fg);border-color:transparent}
.btn.sq{padding:6px 10px;min-width:34px;justify-content:center}
.btn.danger{color:var(--e-danger)}
.btn.armed{background:var(--e-danger);color:#fff;border-color:transparent}
.card{background:var(--e-card);border:1px solid var(--e-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.off{opacity:.6}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.sp{flex:1}
.mini{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.sw{position:relative;width:40px;height:24px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--e-line);border-radius:999px;transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:#1f9d55}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--e-accent);outline-offset:2px}
.prof-ed{display:flex;align-items:center;gap:14px}
.prof-ed .av{width:64px;height:64px;font-size:22px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatch{border:2px solid var(--e-line);border-radius:12px;padding:0;height:78px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:8px;overflow:hidden}
.swatch i{display:block;height:9px;border-radius:99px}
.swatch b{font:600 11px var(--f-body);text-align:left;margin-top:2px}
.swatch.on{border-color:var(--e-accent);box-shadow:0 0 0 2px var(--e-accent)}
.seg{display:flex;border:1px solid var(--e-line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--e-fg);font:600 13px var(--f-body);padding:8px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--e-fg);color:var(--e-bg)}
.hint{font-size:12.5px;color:var(--e-muted);margin:0;line-height:1.45}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){.lk,.cta,.sw span,.sw span::after{transition:none}.lk:hover,.cta:hover{transform:none}}
</style>
</head>

  u=String(u||'').trim(); if(!u)return '';
  if(/^(javascript|data|vbscript):/i.test(u))return '';
  if(type==='email'||/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(u))return /^mailto:/i.test(u)?u:'mailto:'+u;
  if(type==='phone')return /^tel:/i.test(u)?u:'tel:'+u.replace(/[^\d+]/g,'');
  if(/^[a-z][a-z0-9+.\-]*:/i.test(u))return u;
  return 'https://'+u.replace(/^\/+/,'');
}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

function fillIcon(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'}
var CHEV='<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>';
function card(l){
  var lead=l.icon==='pin'?'<span class="pinc">'+fillIcon('pin')+'</span>':(l.thumb?'<img class="tile" src="'+esc(l.thumb)+'" alt="">':'');
  return '<li><a class="lk" href="'+esc(href(l.url))+'" target="_blank" rel="noopener">'+lead+'<span class="lk-t"><b>'+esc(l.title)+'</b>'+(l.sub?'<small>'+esc(l.sub)+'</small>':'')+'</span>'+CHEV+'</a></li>';
}
function renderPage(){
  var t=THEMES[S.theme]||THEMES.sharqi, de=document.documentElement, r=de.style;
  de.dir=S.dir==='rtl'?'rtl':'ltr';de.lang=S.dir==='rtl'?'ar':'en';
  var map={'--p-outer':t.outer||t.bg2,'--p-bg':t.bg,'--p-bg2':t.bg2,'--p-fg':t.fg,'--p-gold':t.gold,'--p-rule':t.rule,'--c-bg':t.card,'--c-bg2':t.card2,'--c-fg':t.cfg,'--c-sub':t.csub,'--c-chev':t.chev,'--c-pin-bg':t.pinbg,'--c-pin':t.pin};
  for(var k in map)r.setProperty(k,map[k]);
  r.setProperty('--b-radius',{pill:'999px',rounded:'12px',square:'4px'}[S.shape]||'12px');
  document.title=S.name||'Links';
  var links=(S.links||[]).filter(function(l){return l.on!==false&&l.title&&href(l.url)});
  var socials=(S.socials||[]).filter(function(s){return href(s.url,s.type)});
  var secs=S.sections||[], ids={};secs.forEach(function(x){ids[x.id]=1});

  if(S.tagline)h+='<p class="tag">'+esc(S.tagline)+'</p>';
  h+='</header>';
  var loose=links.filter(function(l){return !ids[l.sec]});
  if(loose.length)h+='<div class="sec"><ul class="links">'+loose.map(card).join('')+'</ul></div>';
  secs.forEach(function(x){

    h+='<section class="sec"><div class="sec-h">'+(x.icon&&x.icon!=='none'?'<span class="badge">'+fillIcon(x.icon)+'</span>':'')+'<h2>'+esc(x.title)+'</h2><i class="rule"></i></div><ul class="links">'+ls.map(card).join('')+'</ul></section>';
  });
  if(S.cta&&S.cta.on!==false&&S.cta.label&&href(S.cta.url))h+='<a class="cta" href="'+esc(href(S.cta.url))+'" target="_blank" rel="noopener"><svg class="wa" viewBox="0 0 24 24" aria-hidden="true">'+ICONS.whatsapp+'</svg><span>'+esc(S.cta.label)+'</span>'+CHEV+'</a>';
  if(!links.length)h+='<p class="empty">No links yet.</p>';
  if(socials.length){h+='<nav class="soc" aria-label="Social profiles">';socials.forEach(function(s){h+='<a href="'+esc(href(s.url,s.type))+'" target="_blank" rel="noopener" aria-label="'+esc(label(s.type))+'">'+icon(s.type)+'</a>'});h+='</nav>'}
  h+='</div>';
  $('#app').innerHTML=h;
}

function readImage(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();
      img.onerror=rej;
      img.onload=function(){
        var s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=max;
        c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max);
        var out=c.toDataURL('image/webp',0.85);
        if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',0.86);
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readWide(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){var img=new Image();img.onerror=rej;img.onload=function(){
      var w=Math.min(900,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);var out=c.toDataURL('image/webp',0.8);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',0.8);res(out)};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

    +'<title>'+esc(S.name||'Links')+'</title>\n'
    +'<meta name="description" content="'+esc(S.tagline||S.name||'')+'">\n'
    +'<meta property="og:title" content="'+esc(S.name||'')+'">\n<meta property="og:description" content="'+esc(S.tagline||'')+'">\n'
    +'<meta name="theme-color" content="'+esc((THEMES[S.theme]||THEMES.sharqi).bg)+'">\n'
    +(S.avatar?'<link rel="icon" href="'+esc(S.avatar)+'">\n':'')
    +fonts+'\n<style id="css">'+$('#css').textContent+'</style>\n</head>\n<body>\n<main id="app"></main>\n'
    +'<script type="application/json" id="state">'+data+'<\/script>\n'
    +'<script id="appjs">'+$('#appjs').textContent+'<\/script>\n</body>\n</html>\n';
}
function b64(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function download(){
  var blob=new Blob([buildHtml()],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);status('Downloaded index.html');
}
function cleanUp(){S.links=S.links.filter(function(l){return l.title||l.url});S.socials=S.socials.filter(function(s){return s.url})}
function publish(){
  if(busy)return;
  var g=S.gh||{},tok=getTok();
  if(!g.owner||!g.repo||!tok){status('Fill in the Publishing section at the bottom first.',true);return}
  cleanUp();
  var api='https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)+'/contents/index.html';
  var hdr={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'};
  busy=true;$('#pubBtn').disabled=true;status('Publishing…');
  function fail(msg){busy=false;status(msg,true);$('#pubBtn').disabled=false}
  function attempt(retry){
    fetch(api+'?t='+Date.now(),{headers:hdr,cache:'no-store'}).then(function(r){
      if(r.status===401)throw {m:'The access token was rejected. Paste a new one in Publishing.'};
      if(r.status===404)return null;
      if(!r.ok)throw {m:'GitHub answered '+r.status+'. Try again in a moment.'};
      return r.json();
    }).then(function(cur){
      var body={message:'Update links page',content:b64(buildHtml())};
      if(cur&&cur.sha)body.sha=cur.sha;
      return fetch(api,{method:'PUT',headers:hdr,body:JSON.stringify(body)});
    }).then(function(r){
      if(r.status===409&&!retry)return attempt(true);
      if(r.status===401)throw {m:'The access token was rejected. Paste a new one in Publishing.'};
      if(r.status===403||r.status===404)throw {m:'The token can\'t write to that repository. Check the username, repository name and the token\'s Contents permission.'};
      if(!r.ok)throw {m:'GitHub answered '+r.status+'. Try again in a moment.'};
      busy=false;ORIGINAL=JSON.stringify(S);changed();status('Published. Live for everyone in about 1–2 minutes.');
    }).catch(function(e){fail(e&&e.m?e.m:'Couldn\'t reach GitHub. Check your connection and try again.')});
  }
  attempt(false);
}

renderPage();
function checkAdmin(){if(location.hash==='#admin'&&!document.getElementById('editFab'))mountEditor()}
checkAdmin();window.addEventListener('hashchange',checkAdmin);
})();
